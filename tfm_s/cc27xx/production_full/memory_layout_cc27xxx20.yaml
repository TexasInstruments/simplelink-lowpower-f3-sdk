{
    # 0x0-0x6800 reserved for pre-provisioned keys + BL2 + BIM info
    # 0x6800-0xD000 reserved for ITS, PS, & NV counters storage
    "S_ROM_BASE":   "0x0000D000",    # S ROM base is fixed at 0xD000
    "S_ROM_LIMIT":  "0x00038000",    # S ROM size: 172 KB (same as cc27xxx10)
    "S_RAM_BASE":   "0x20000028",    # S RAM base is fixed at 0x2000_0000 + 40 B for boot seed
    "S_RAM_LIMIT":  "0x2000C000",    # S RAM size: 48 KB - 40 B (same as cc27xxx10)
    # Bit 28 is set for all NS addresses as required by the TCM
    "NS_ROM_BASE":  "0x10038000",    # NS ROM base starts after S ROM limit
    "NS_ROM_LIMIT": "0x101E8000",    # NS ROM limit: end of flash (2 MB) - HSM FW (96 KB)
    "NS_RAM_BASE":  "0x3000C000",    # NS RAM base starts after S RAM limit
    "NS_RAM_LIMIT": "0x30048000",    # NS RAM limit: end of RAM (288 KB)
    "FLASH_SIZE":   "0x00200000",    # Total flash: 2 MB
    "RAM_SIZE":     "0x00048000"     # Total RAM: 288 KB
}
